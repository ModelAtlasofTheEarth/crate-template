name: Configure dataset (the whole crate)
description: Configure dataset (the whole crate)
title: '[configure crate] dataset metadata'
labels:
- crate-edit
body:
- type: markdown
  attributes:
    value: 'Configure the dataset as a whole — title, description, license, creators.
      *(You can leave the issue title above as-is — it''s just a marker; the dataset''s
      title is the field below.)* On submit, an action writes these onto the crate''s
      **root** entity (`ro-crate-metadata.json`, the single source of truth). **Edit
      the crate afterwards (CLI / Crate-O), not by reopening this issue.**


      > **Where is it?** *In this repository* → it''s a **data entity** (use *Edit
      a data entity*, or its typed forms). *Hosted elsewhere* → it''s a **reference**
      (use *Add a contextual entity*).'
- type: input
  id: title
  attributes:
    label: Dataset title (the human-readable name, not the repo slug)
  validations:
    required: false
- type: textarea
  id: description
  attributes:
    label: Short description
  validations:
    required: false
- type: dropdown
  id: license
  attributes:
    label: License
    options:
    - CC-BY-4.0
    - CC-BY-SA-4.0
    - CC0-1.0
    - Apache-2.0
    - MIT
    - GPL-3.0
    - LGPL-3.0
    - MPL-2.0
    - (other URL)
  validations:
    required: false
- type: textarea
  id: creators
  attributes:
    label: Creator(s) — ORCID iD or 'Family, Given'
    description: 'One per line: an ORCID iD (e.g. 0000-0002-1270-4377), or "Family,
      Given".'
  validations:
    required: false
- type: input
  id: keywords
  attributes:
    label: Keywords
    description: Comma-separated.
  validations:
    required: false
- type: input
  id: publication
  attributes:
    label: Related publication (DOI)
  validations:
    required: false

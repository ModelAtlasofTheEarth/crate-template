name: Edit a data entity (a local file/folder)
description: Edit a data entity (a local file/folder)
title: '[edit data] (the entity selected below)'
labels:
- crate-edit
body:
- type: markdown
  attributes:
    value: 'Edit metadata for one **local file or folder** in this dataset (a *data
      entity*). Pick it above, then fill only what you want to set (blank = leave
      as-is). On submit, an action writes it into the crate. Picking a type under
      *What is it?* unlocks that type''s fields on a dedicated form after the next
      build.


      > **Where is it?** *In this repository* → it''s a **data entity** (use *Edit
      a data entity*, or its typed forms). *Hosted elsewhere* → it''s a **reference**
      (use *Add a contextual entity*).'
- type: dropdown
  id: path
  attributes:
    label: Which entity to edit
    options:
    - (the dataset itself / root)
  validations:
    required: false
- type: dropdown
  id: entity_type
  attributes:
    label: What is it?
    description: Optional — what this file/folder IS. Picking a type unlocks its type-specific
      fields on a dedicated form after the next build. (A packaged tool you merely
      *used* lives elsewhere → add it via *Add a contextual entity*.)
    options:
    - (keep current)
    - Dataset
    - Software source code (your code / scripts in this repo)
    - Image / figure
    - Other (generic creative work)
  validations:
    required: false
- type: input
  id: ent_name
  attributes:
    label: Name
  validations:
    required: false
- type: textarea
  id: ent_description
  attributes:
    label: Description
  validations:
    required: false
- type: input
  id: ent_keywords
  attributes:
    label: Keywords
    description: Comma-separated.
  validations:
    required: false
- type: textarea
  id: ent_author
  attributes:
    label: Author(s) — ORCID iD or 'Family, Given'
    description: 'One per line: an ORCID iD (e.g. 0000-0002-1270-4377), or "Family,
      Given".'
  validations:
    required: false

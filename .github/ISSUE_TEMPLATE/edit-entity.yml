name: Add / edit metadata
description: Add or edit metadata on an entity in the crate (defaults to the dataset
  root).
title: '[edit] '
labels:
- mate-edit
body:
- type: markdown
  attributes:
    value: Add or edit metadata for this dataset — or for one specific folder/file
      in it (pick it above; leave as the root for the dataset as a whole). On submit,
      an automated action writes your answers into the RO-Crate (`ro-crate-metadata.json`)
      — the single source of truth. **Edit the crate afterwards (CLI / Crate-O), not
      by reopening this issue.**
- type: dropdown
  id: path
  attributes:
    label: Which entity to edit
    options:
    - (the dataset itself / root)
    - _site/
    - data/
    - large_data/
  validations:
    required: false
- type: dropdown
  id: entity_type
  attributes:
    label: Type tag (optional — type-specific fields are edited in Crate-O)
    options:
    - (keep current)
    - Dataset
    - SoftwareSourceCode
    - SoftwareApplication
    - ImageObject
    - CreativeWork
  validations:
    required: false
- type: input
  id: title
  attributes:
    label: Title
  validations:
    required: false
- type: textarea
  id: description
  attributes:
    label: Short description
  validations:
    required: false
- type: input
  id: license
  attributes:
    label: License (SPDX id or URL)
  validations:
    required: false
- type: textarea
  id: creators
  attributes:
    label: Creator(s) — ORCID iD or 'Family, Given'
    description: 'One per line: an ORCID iD (e.g. 0000-0002-1270-4377), or "Family,
      Given".'
  validations:
    required: false
- type: input
  id: keywords
  attributes:
    label: Keywords
    description: Comma-separated.
  validations:
    required: false
- type: input
  id: publication
  attributes:
    label: Related publication (DOI)
  validations:
    required: false
- type: dropdown
  id: payload_backend
  attributes:
    label: External data payload — backend (optional)
    options:
    - (none)
    - git
    - zenodo
    - url
  validations:
    required: false
- type: input
  id: payload_ref
  attributes:
    label: Payload reference (e.g. Zenodo record id, or a URL)
  validations:
    required: false

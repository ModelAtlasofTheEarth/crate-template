name: Tag website content (a file's role)
description: Tag website content (a file's role)
title: '[tag content] (the file below)'
labels:
- crate-edit
body:
- type: markdown
  attributes:
    value: 'Tag a **local file** with the role it plays on this record''s web page
      — its *communicative function* (graphical abstract, setup diagram, figure…).
      Pick the file and its role; an action records the role on the crate (as `additionalType`,
      keeping the file''s structural type) and stores your caption. The role decides
      where the asset appears on the page.


      > **Where is it?** *In this repository* → it''s a **data entity** (use *Edit
      a data entity*, or its typed forms). *Hosted elsewhere* → it''s a **reference**
      (use *Add a contextual entity*).'
- type: dropdown
  id: path
  attributes:
    label: Which entity to edit
    options:
    - (the dataset itself / root)
  validations:
    required: false
- type: dropdown
  id: role_term
  attributes:
    label: What is this file?
    description: '- **Graphical abstract** — The single image that best summarises
      the whole work at a glance — the hero visual.

      - **Setup diagram** — A figure depicting how the work was set up — geometry,
      domain, configuration, or initial/boundary conditions.

      - **Process animation** — A time-evolving movie of a process, simulation, or
      system rendered over time.

      - **Key result figure** — A figure presenting a primary scientific result of
      the work.

      - **Figure** — A supporting figure for the gallery — any image not assigned
      a more specific term.

      - **Plain-language summary** — A non-technical summary of the work and its findings
      for a general audience — distinct from the technical abstract.

      - **Data availability statement** — A statement of what data and code are provided
      and where they can be obtained.'
    options:
    - Graphical abstract
    - Setup diagram
    - Process animation
    - Key result figure
    - Figure
    - Plain-language summary
    - Data availability statement
  validations:
    required: true
- type: textarea
  id: role_caption
  attributes:
    label: Caption (short; shown with the asset)
  validations:
    required: false

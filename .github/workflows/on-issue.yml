# When an "Add / edit metadata" issue is opened/edited, apply it to the crate. The issue is one
# generic entity editor — it edits the root by default, or a specific folder/file you pick. Thin
# caller; logic is in the toolkit's reusable workflow (which also comments back the equivalent
# `crate` command).
name: Apply metadata edit

on:
  issues:
    types: [opened, edited]

jobs:
  apply:
    # The TEMPLATE itself is inert (any "-template" repo skips) so you can't edit it via issues —
    # you must make a repo from it first. Then gate on the title prefixes the four forms set
    # ("[configure …" / "[edit …" / "[add …" / "[tag …"); blank issues are disabled (ISSUE_TEMPLATE/config.yml)
    # so every issue comes from a form. The label check is a backup.
    if: ${{ !endsWith(github.repository, '-template') && (startsWith(github.event.issue.title, '[configure') || startsWith(github.event.issue.title, '[edit') || startsWith(github.event.issue.title, '[add') || startsWith(github.event.issue.title, '[tag') || contains(github.event.issue.labels.*.name, 'crate-edit')) }}
    uses: ModelAtlasofTheEarth/crate-kit/.github/workflows/build.yml@v0
    with:
      issue_body: ${{ github.event.issue.body }}
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
    permissions:
      contents: write
      issues: write

# When an "Add / edit metadata" issue is opened/edited, apply it to the crate. The issue is one
# generic entity editor — it edits the root by default, or a specific folder/file you pick. Thin
# caller; logic is in the toolkit's reusable workflow (which also comments back the equivalent
# `mate` command).
name: Apply metadata edit

on:
  issues:
    types: [opened, edited]

jobs:
  apply:
    # Gate on the title prefix the issue form sets ("[edit] …") — blank issues are disabled
    # (see ISSUE_TEMPLATE/config.yml) so every issue comes from the form and carries it. The
    # label check is a backup for repos where the `mate-edit` label happens to exist.
    if: ${{ startsWith(github.event.issue.title, '[edit]') || contains(github.event.issue.labels.*.name, 'mate-edit') }}
    uses: ModelAtlasofTheEarth/mate-toolkit/.github/workflows/build.yml@v0
    with:
      issue_body: ${{ github.event.issue.body }}
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
    permissions:
      contents: write
      issues: write
